{% extends "base.html" %}
{% block title %}Delete User{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
  <h2 class="mb-3">Delete user?</h2>
  <p>Are you sure you want to delete <strong>{{ target_user.username }}</strong> ({{ target_user.email }})? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'admin_panel:user_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
