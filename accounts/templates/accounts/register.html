{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="col-md-5 mx-auto">
  <h2 class="mb-3">Create your account</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-primary mt-3">Sign up</button>
  </form>
  <p class="mt-3">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>
{% endblock %}
