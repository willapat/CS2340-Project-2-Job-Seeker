{% extends 'base.html' %}
{% block content %}
<div class="col-lg-8 mx-auto">
  <h2 class="mb-3">{{ template_data.title }}</h2>
  <form method="POST">
    {% csrf_token %}
    {{ template_data.form.as_div }}
    <button type="submit" class="btn btn-primary">Save Job Listing</button>
    <a href="{% url 'jobs.index' %}" class="btn btn-primary">Cancel</a>
  </form>
</div>
{% endblock %}
